# Builds the hosted web app's Docker image and publishes it to GitHub's container registry (free for public
# repositories), so a server only runs `docker compose pull` instead of building on its own small CPU.
# The image holds no secrets: API keys come from the server's .env at run time (.dockerignore keeps .env out).
# A new package starts private: make it public once under the package's settings, or log the server in to ghcr.io.
name: docker-image

on:
  push:
    branches: [web-app, main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "tests/**", "examples/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Image name (the registry needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4   # the Arm image (Oracle's free Ampere servers) is built under emulation
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
