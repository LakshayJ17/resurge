[project]
name = "resurge"
version = "0.1.0"
description = "Resurge - a free, multi-agent AI competitive-intelligence company (research, validation, analysis, risk, reporting, self-improvement)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.15",
  "rich>=13.9",
  "ddgs>=9.0",
  "trafilatura>=2.0",
  "feedparser>=6.0",
  "json-repair>=0.40",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "matplotlib>=3.9",
  "jinja2>=3.1",
  "mcp>=2.3,<3",
  "tld>=0.13",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
gsheets = ["gspread>=6.0", "google-auth>=2.30"]
# RAG chat over finished runs: local ONNX embeddings (free) + Qdrant (embedded local mode or free Cloud cluster)
rag = ["qdrant-client>=1.19", "fastembed>=0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
resurge = "resurge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resurge"]

[tool.hatch.build.targets.wheel.force-include]
# bundled defaults so a plain `pip install` works outside the repo (a local ./config still wins)
"config/models.yaml" = "resurge/config/models.yaml"
"config/mcp_servers.example.yaml" = "resurge/config/mcp_servers.example.yaml"
".env.example" = "resurge/config/env.example"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
