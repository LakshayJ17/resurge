# Resurge on a server. See docs/DEPLOY.md.
#
#   docker compose up -d                        app only, on http://127.0.0.1:8000 (put HTTPS in front)
#   docker compose --profile caddy up -d        + automatic HTTPS for DOMAIN (opens ports 80 and 443)
#   docker compose --profile tunnel up -d       + Cloudflare Tunnel (HTTPS without opening any port)
#
# The image is built by GitHub Actions (.github/workflows/docker-image.yml) and pulled with `docker compose pull`,
# so a small server never has to build it. `--build` builds it on the server instead.

x-logs: &logs  # keep container logs from slowly filling the disk
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  resurge:
    build: .
    image: ${RESURGE_IMAGE:-ghcr.io/lakshayj17/resurge:latest}
    restart: unless-stopped
    logging: *logs
    env_file: .env
    environment:
      # the app is only reachable through Caddy or the tunnel, which set the client-IP header. Caddy: 1 (reads
      # X-Forwarded-For); Cloudflare Tunnel: set RESURGE_TRUST_PROXY=cloudflare in .env (reads CF-Connecting-IP)
      RESURGE_TRUST_PROXY: ${RESURGE_TRUST_PROXY:-1}
    volumes:
      - resurge-data:/data
    ports:
      - "127.0.0.1:8000:8000"    # bound to localhost only: never exposed directly to the internet
    mem_limit: 3g

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    logging: *logs
    depends_on: [resurge]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-}   # set in .env, e.g. resurge-yourname.duckdns.org
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [resurge]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # set in .env

volumes:
  resurge-data:
  caddy-data:
  caddy-config:
